# Netlify: sadece web uygulamasını derler ve yayınlar.
# Netlify > Site settings > Environment variables: API_ORIGIN = Railway API adresi
[build]
  command = "npm ci && npm run build -w @fashionos/web && node apps/web/scripts/netlify-redirects.mjs"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self)"
